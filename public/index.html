<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Around The U.S.</title>
    <link rel="stylesheet" href="./pages/index.css" />
  </head>

  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          src="./images/logo.svg"
          alt="Logotipo Around The U.S."
          class="logo header__logo"
        />
      </header>

      <main class="content">
        <section class="profile page__section">
          <img src="./images/avatar.jpg" alt="Avatar" class="profile__image" />

          <div class="profile__info">
            <h1 class="profile__title">Jacques Cousteau</h1>
            <button class="profile__edit-button" type="button"></button>
            <p class="profile__description">Explorador</p>
          </div>

          <button class="profile__add-button" type="button"></button>
        </section>

        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>
      </main>

      <footer class="footer page__section">
        <p class="footer__copyright">© 2026 Around The U.S.</p>
      </footer>
    </div>

    <template id="card-template">
      <li class="card">
        <img class="card__image" src="#" alt="" />
        <button class="card__delete-button" type="button"></button>
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button class="card__like-button" type="button"></button>
        </div>
      </li>
    </template>

    <!-- Popup editar perfil -->
    <div class="popup" id="profile-popup">
      <div class="popup__container">
        <button class="popup__close" type="button"></button>
        <h2 class="popup__title">Editar perfil</h2>

        <form class="popup__form" name="profile-form" novalidate>
          <input
            id="profile-name-input"
            class="popup__input"
            type="text"
            name="name"
            placeholder="Nombre"
            required
            minlength="2"
            maxlength="40"
          />
          <span class="profile-name-input-error popup__error"></span>

          <input
            id="profile-description-input"
            class="popup__input"
            type="text"
            name="description"
            placeholder="Acerca de mí"
            required
            minlength="2"
            maxlength="200"
          />
          <span class="profile-description-input-error popup__error"></span>

          <button class="popup__button" type="submit">Guardar</button>
        </form>
      </div>
    </div>

    <!-- Popup agregar tarjeta -->
    <div class="popup" id="add-card-popup">
      <div class="popup__container">
        <button class="popup__close" type="button"></button>
        <h2 class="popup__title">Nuevo lugar</h2>

        <form class="popup__form" name="add-card-form" novalidate>
          <input
            id="card-title-input"
            class="popup__input"
            type="text"
            name="title"
            placeholder="Título"
            required
            minlength="2"
            maxlength="30"
          />
          <span class="card-title-input-error popup__error"></span>

          <input
            id="card-link-input"
            class="popup__input"
            type="url"
            name="link"
            placeholder="Enlace a la imagen"
            required
          />
          <span class="card-link-input-error popup__error"></span>

          <button class="popup__button" type="submit">Crear</button>
        </form>
      </div>
    </div>

    <!-- Popup imagen -->
    <div class="popup" id="image-popup">
      <div class="popup__image-container">
        <button class="popup__close" type="button"></button>
        <img class="popup__image" src="#" alt="" />
        <p class="popup__caption"></p>
      </div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
